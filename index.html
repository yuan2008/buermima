<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#FFB7C5">
    <title>🐱 超肉麻喵 · 每日密码生成器</title>
    <!-- 引入 CryptoJS MD5 库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(145deg, #ffe6f0 0%, #ffd9e6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Poppins', 'Helvetica Neue', 'Noto Sans', sans-serif;
            padding: 20px;
            position: relative;
        }

        /* 可爱漂浮装饰 */
        body::before {
            content: "🌸🐾🌸";
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 32px;
            opacity: 0.2;
            pointer-events: none;
            white-space: nowrap;
            letter-spacing: 12px;
        }

        body::after {
            content: "✨💖✨";
            position: absolute;
            bottom: 15px;
            right: 10px;
            font-size: 28px;
            opacity: 0.25;
            pointer-events: none;
        }

        /* 主卡片 */
        .card {
            background-color: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(2px);
            border-radius: 56px;
            box-shadow: 0 25px 45px rgba(255, 105, 180, 0.25), 0 8px 18px rgba(0, 0, 0, 0.05), inset 0 1px 0 rgba(255,255,255,0.8);
            width: 100%;
            max-width: 520px;
            padding: 2rem 1.8rem 2.2rem;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 220, 230, 0.7);
            position: relative;
            z-index: 2;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.5s ease, transform 0.4s ease;
            pointer-events: none;
        }
        .card.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* 头部区 */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .cat-icon {
            font-size: 58px;
            filter: drop-shadow(2px 4px 12px rgba(255, 80, 120, 0.3));
            animation: bounceSoft 2s infinite ease;
            display: inline-block;
        }

        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #FF90B5, #FFB7C5, #FFA0C0);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.3px;
            margin-top: 8px;
            text-shadow: 0 2px 5px rgba(255, 200, 210, 0.5);
        }

        .sub {
            font-size: 0.8rem;
            color: #e48aaa;
            background: #fff0f5;
            display: inline-block;
            padding: 4px 14px;
            border-radius: 40px;
            margin-top: 8px;
            font-weight: 500;
        }

        /* 输入框组 */
        .input-group {
            margin-bottom: 28px;
            position: relative;
        }

        .input-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            color: #c96f8f;
            margin-bottom: 8px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }
        .clear-memory {
            text-align: right;
            margin-top: 8px;
        }
        
        .clear-btn {
            background: #ffe0eb;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #e47a9e;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(255, 100, 130, 0.15);
            backdrop-filter: blur(2px);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        
        .clear-btn:active {
            transform: scale(0.96);
            background: #ffd0de;
            color: #c95f83;
        }
        .username-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.05rem;
            border: 2px solid #ffe2ed;
            border-radius: 60px;
            background: #fffef7;
            transition: all 0.25s;
            outline: none;
            font-weight: 500;
            color: #7a4e60;
            font-family: inherit;
        }
        
        .username-input:focus {
            border-color: #FF9EBB;
            box-shadow: 0 0 0 4px rgba(255, 158, 187, 0.2);
            background: white;
        }
        
        /* 日期展示条 */
        .date-badge {
            background: #ffeef4;
            border-radius: 100px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 10px;
            border: 1px solid #ffd6e4;
        }
        
        .date-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
            background: white;
            padding: 5px 14px;
            border-radius: 50px;
            color: #e47a9e;
            font-weight: 600;
            box-shadow: inset 0 1px 2px #ffe0ea, 0 1px 2px white;
        }
        
        .refresh-date-btn {
            background: #ffb7c9;
            border: none;
            padding: 8px 18px;
            border-radius: 60px;
            color: white;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(255, 100, 130, 0.2);
        }
        
        /* 密码区域 */
        .password-area {
            background: #fff9fb;
            border-radius: 48px;
            padding: 20px 18px;
            margin-bottom: 28px;
            border: 2px dashed #ffc0d0;
            box-shadow: inset 0 1px 5px #ffe0ea, 0 5px 12px rgba(0,0,0,0.02);
        }
        
        .password-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            color: #f0a1bd;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .password-value {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 1rem;
            word-break: break-all;
            background: #ffffffcc;
            padding: 14px 12px;
            border-radius: 34px;
            color: #bf6f8a;
            font-weight: 500;
            letter-spacing: 0.3px;
            border: 1px solid #ffecf0;
            line-height: 1.4;
        }
        
        .error-pwd {
            color: #ff8aa7;
            font-family: inherit;
        }
        
        /* 按钮组 */
        .button-group {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn {
            flex: 1;
            padding: 14px 8px;
            border-radius: 66px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: white;
            color: #e47a9e;
            box-shadow: 0 4px 10px rgba(255, 90, 120, 0.15);
            border: 1px solid #ffd3e0;
        }
        
        .btn-primary {
            background: linear-gradient(115deg, #FFB7C5, #FF9EBB);
            color: white;
            border: none;
            box-shadow: 0 8px 18px #ffb0c470;
        }
        
        /* 点击动画 (弹跳+微光) */
        .btn-clicked {
            transform: scale(0.94) !important;
            transition: transform 0.08s cubic-bezier(0.2, 1.6, 0.4, 1);
            filter: brightness(1.05);
        }
        
        /* 飘浮爱心动画容器 */
        .floating-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 28px;
            animation: floatUp 1s ease-out forwards;
        }
        
        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(0.6);
                opacity: 1;
            }
            100% {
                transform: translateY(-120px) scale(1.2);
                opacity: 0;
            }
        }
        
        /* 自定义弹窗 (白名单消息专用) */
        .custom-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            visibility: hidden;
            opacity: 0;
            transition: all 0.2s ease;
        }
        .custom-modal.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-overlay {
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(255, 180, 190, 0.4);
            backdrop-filter: blur(4px);
        }
        .modal-content {
            position: relative;
            background: #fffafc;
            max-width: 280px;
            width: 80%;
            padding: 28px 20px 24px;
            border-radius: 68px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(255, 80, 120, 0.3);
            border: 2px solid #ffbfcf;
            animation: modalPop 0.25s ease-out;
        }
        @keyframes modalPop {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-emoji {
            font-size: 48px;
            margin-bottom: 12px;
        }
        .modal-message {
            color: #c2698a;
            font-weight: 600;
            font-size: 1.2rem;
            margin: 12px 0 16px;
            word-break: break-word;
            line-height: 1.4;
        }
        .modal-close {
            background: #ffb7c9;
            border: none;
            padding: 8px 24px;
            border-radius: 50px;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.1s;
        }
        .modal-close:active {
            transform: scale(0.96);
        }
        
        footer {
            text-align: center;
            font-size: 0.6rem;
            color: #f4adc4;
            margin-top: 20px;
        }

        /* ----------------- 超肉麻人机验证弹窗 ----------------- */
        .verify-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 210, 225, 0.92);
            backdrop-filter: blur(12px);
            z-index: 20000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.34, 1.2, 0.64, 1);
        }
        .verify-card {
            background: #fff9fc;
            border-radius: 88px;
            max-width: 320px;
            width: 85%;
            padding: 2rem 1.5rem;
            text-align: center;
            box-shadow: 0 30px 40px rgba(255, 80, 120, 0.3);
            border: 3px solid #ffc0d0;
            animation: bounceIn 0.5s ease;
        }
        @keyframes bounceIn {
            0% { transform: scale(0.7); opacity: 0; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .verify-emoji {
            font-size: 70px;
            margin-bottom: 16px;
            filter: drop-shadow(2px 4px 12px #ffb0c0);
            animation: heartbeat 1.2s infinite ease;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .verify-title {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #FF90B5, #FFB0C5);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 12px;
        }
        .verify-desc {
            color: #d sixteen;
            font-size: 0.9rem;
            background: #ffeef4;
            padding: 8px 12px;
            border-radius: 60px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .paw-area {
            background: #fff0f5;
            border-radius: 80px;
            padding: 20px;
            margin: 10px 0;
            cursor: pointer;
            transition: 0.1s;
            user-select: none;
        }
        .paw-area:active {
            transform: scale(0.97);
            background: #ffe4ed;
        }
        .paw-emoji {
            font-size: 56px;
            filter: drop-shadow(0 4px 8px #ffafc0);
        }
        .click-counter {
            font-size: 1.1rem;
            margin-top: 12px;
            color: #e47a9e;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .verify-tip {
            font-size: 0.75rem;
            color: #f0a1bd;
            margin-top: 16px;
        }
        .verify-success {
            background: #ffd9e6;
            border-radius: 60px;
            padding: 12px;
            margin-top: 12px;
            color: #bf6f8a;
            font-weight: bold;
            display: none;
        }
        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .card { padding: 1.6rem 1.3rem; }
            .password-value { font-size: 0.85rem; }
            .cat-icon { font-size: 48px; }
            h1 { font-size: 1.6rem; }
            .verify-card { padding: 1.5rem 1.2rem; }
        }
    </style>
</head>

<body>
    <!-- 主应用卡片（初始隐藏，验证后才显示） -->
    <div class="card" id="mainCard">
        <div class="header">
            <div class="cat-icon">🐱💗🌸</div>
            <h1>不二胖喵 · 每日秘语</h1>
            <div class="sub">✨ 只属于今天的魔法密码 ✨</div>
        </div>

        <div class="input-group">
            <div class="input-label"><span>🐾</span> 你的专属昵称</div>
            <input type="text" id="usernameInput" class="username-input" placeholder="例如: 小草莓 / 胖喵酱" autocomplete="off">
            <div class="clear-memory">
                <button id="clearMemoryBtn" class="clear-btn" type="button">🧹 清除记忆用户名</button>
            </div>
        </div>

        <div class="date-badge">
            <div class="date-info"><span>📅🌸</span> 今日密钥日期 <strong id="todayDateDisplay">----</strong></div>
            <button id="refreshDateBtn" class="refresh-date-btn">🔄 刷新今日密码</button>
        </div>

        <div class="password-area">
            <div class="password-label"><span>🔐🍰</span> 每日密码 (MD5)</div>
            <div id="passwordDisplay" class="password-value">💖 输入用户名后自动生成 💖</div>
        </div>

        <div class="button-group">
            <button id="copyBtn" class="btn btn-primary">📋 一键复制密码</button>
            <button id="manualGenBtn" class="btn btn-outline">✨ 生成 / 同步</button>
        </div>
        <footer>🐈 每天密码都会不同 · 每点一下都会飞出小爱心哟 💕</footer>
    </div>

    <!-- 白名单自定义弹窗 -->
    <div id="whitelistModal" class="custom-modal">
        <div class="modal-overlay"></div>
        <div class="modal-content">
            <div class="modal-emoji">🎀✨</div>
            <div class="modal-message" id="modalMessageText">专属小惊喜</div>
            <button class="modal-close" id="modalCloseBtn">💖 知道啦 💖</button>
        </div>
    </div>

    <!-- toast 提示 -->
    <div id="toastMsg" class="toast-msg" style="position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#ff90b5dd; backdrop-filter:blur(12px); color:white; padding:12px 24px; border-radius:60px; font-size:0.9rem; font-weight:600; opacity:0; transition:opacity 0.2s; pointer-events:none; z-index:10001; white-space:nowrap;">🌸 已复制</div>

    <!-- 超肉麻人机验证层 (启动即显示) -->
    <div id="verifyOverlay" class="verify-overlay">
        <div class="verify-card">
            <div class="verify-emoji">🐱💕</div>
            <div class="verify-title">诶嘿～ 小可爱</div>
            <div class="verify-desc">💗 请证明你不是机器人，而是一只软乎乎的喵咪 💗</div>
            <div id="pawClickZone" class="paw-area">
                <div class="paw-emoji">🐾🌸🐾</div>
                <div class="click-counter" id="clickCounterMsg">戳我3下 ʚɞ</div>
            </div>
            <div class="verify-tip">💖 轻轻按按肉球，按满3次就能进入魔法世界 💖</div>
            <div id="verifySuccessMsg" class="verify-success">✨ 认证成功！ 宝贝请进 ✨</div>
        </div>
    </div>

    <script>
        (function() {
            // ---------- DOM 元素 ----------
            const mainCard = document.getElementById('mainCard');
            const verifyOverlay = document.getElementById('verifyOverlay');
            const pawZone = document.getElementById('pawClickZone');
            const clickCounterMsg = document.getElementById('clickCounterMsg');
            const verifySuccessMsgDiv = document.getElementById('verifySuccessMsg');
            
            const usernameInput = document.getElementById('usernameInput');
            const todayDateSpan = document.getElementById('todayDateDisplay');
            const passwordDisplayDiv = document.getElementById('passwordDisplay');
            const copyBtn = document.getElementById('copyBtn');
            const refreshDateBtn = document.getElementById('refreshDateBtn');
            const manualGenBtn = document.getElementById('manualGenBtn');
            const clearMemoryBtn = document.getElementById('clearMemoryBtn');
            const toastEl = document.getElementById('toastMsg');
            const whitelistModal = document.getElementById('whitelistModal');
            const modalMessageSpan = document.getElementById('modalMessageText');
            const modalCloseBtn = document.getElementById('modalCloseBtn');
            
            // ---------- 人机验证逻辑 (戳3次可爱肉球) ----------
            let clickCount = 0;
            const MAX_CLICKS = 3;
            
            function updateVerifyUI() {
                if (clickCount === 0) {
                    clickCounterMsg.innerHTML = "🐾 戳我3下 ʚɞ 🐾";
                } else if (clickCount === 1) {
                    clickCounterMsg.innerHTML = "💕 一下啦～ 再戳两次嘛 💕";
                } else if (clickCount === 2) {
                    clickCounterMsg.innerHTML = "🌸 两下咯！ 最后一次！ 超乖 🌸";
                } else if (clickCount === 3) {
                    clickCounterMsg.innerHTML = "🎉 呜哇 认证成功啦！ 🎉";
                    verifySuccessMsgDiv.style.display = "block";
                    // 延迟关闭验证层，显示主界面
                    setTimeout(() => {
                        verifyOverlay.style.opacity = "0";
                        setTimeout(() => {
                            verifyOverlay.style.display = "none";
                            mainCard.classList.add('active');
                            // 验证完成后，如果已保存用户名则自动生成密码
                            initMainApp();
                        }, 400);
                    }, 600);
                }
            }
            
            function onPawClick() {
                if (clickCount >= MAX_CLICKS) return;
                clickCount++;
                updateVerifyUI();
                // 生成飘浮爱心特效 (从点击位置)
                const rect = pawZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                createFloatingHeart(centerX, centerY);
                // 额外多飘几个
                setTimeout(() => {
                    createFloatingHeart(centerX + (Math.random() - 0.5)*30, centerY + (Math.random() - 0.5)*30);
                }, 50);
                // 震动感（可选无伤大雅）
                pawZone.style.transform = "scale(0.96)";
                setTimeout(() => { pawZone.style.transform = ""; }, 120);
            }
            
            // 飘浮爱心 (全局)
            function createFloatingHeart(x, y) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart';
                const emojis = ['💖', '🌸', '🐱', '✨', '🍰', '💕', '🐾'];
                heart.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
                heart.style.left = (x - 20) + 'px';
                heart.style.top = (y - 20) + 'px';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1000);
            }
            
            // 按钮按压动画 + 爱心 (无音频)
            function addButtonEffect(btnElement) {
                if (!btnElement) return;
                btnElement.addEventListener('click', (e) => {
                    btnElement.classList.add('btn-clicked');
                    setTimeout(() => btnElement.classList.remove('btn-clicked'), 120);
                    const rect = btnElement.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const centerY = rect.top + rect.height / 2;
                    createFloatingHeart(centerX, centerY);
                    setTimeout(() => {
                        createFloatingHeart(centerX + (Math.random() - 0.5) * 40, centerY + (Math.random() - 0.5) * 30);
                    }, 50);
                });
            }
            
            // ---------- 白名单配置 (可设置多人的专属弹窗消息) 更肉麻版本 ----------
            const whitelistMessages = {
                "小草莓": "🍓 小草莓宝贝！ 今天也是甜甜的一天，快让喵喵亲一口～ 💋💖",
                "胖喵酱": "🐱 胖喵酱小可爱驾到！ 捏捏你的小脸蛋，今天必须开心！ 🌸",
                "不二胖喵": "✨ 主人回家啦！ 不二胖喵的心扑通扑通，好想你呀～ 🎀 要抱抱！",
                "布丁": "🍮 呜～布丁小软糖！ 给你全世界最甜的拥抱 🥰 啵啵！",
                "奶茶": "🧋 奶茶宝贝，你的甜度已经超过全糖啦！ 今天也要元气满满哟 💗",
                "牟晨稳": "🐮 牟牟宝宝乖乖～ 你要做全世界最听话的小牛牛 啾咪❤️",
                "邱德良": "✨ 帅气毛毛邱德良！ 今天的晚霞和你一样浪漫，黄色的小星星都为你闪呀闪 🌟",
                "刘哲": "🌸 小哲哲～ 你一来空气都变甜了！ 给你一个能把冰山融化的抱抱 🧸",
                "王浩": "🐾 诶呀是王浩宝宝，你居然有女朋友，有女朋友了你还来找我!生气气 🐕💖",
                "杨玲飞": "是小飞飞哦~  可可爱爱的小飞飞(づ◡ど)"
            };
            
            function showWhitelistMessageIfNeeded(username) {
                if (!username) return false;
                const lowerKey = username.toLowerCase();
                let matchedMessage = null;
                for (let [key, msg] of Object.entries(whitelistMessages)) {
                    if (key.toLowerCase() === lowerKey) {
                        matchedMessage = msg;
                        break;
                    }
                }
                if (matchedMessage) {
                    modalMessageSpan.innerText = matchedMessage;
                    whitelistModal.classList.add('show');
                    // 弹窗出现也飘个爱心
                    createFloatingHeart(window.innerWidth/2, window.innerHeight/2);
                    return true;
                }
                return false;
            }
            
            function closeModal() {
                whitelistModal.classList.remove('show');
            }
            modalCloseBtn.addEventListener('click', closeModal);
            whitelistModal.addEventListener('click', (e) => {
                if (e.target === whitelistModal || e.target.classList.contains('modal-overlay')) closeModal();
            });
            
            // 核心功能函数
            function getTodayDateStr() {
                const now = new Date();
                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, '0');
                const day = String(now.getDate()).padStart(2, '0');
                return `${year}${month}${day}`;
            }
            
            function generateDailyPassword(username, dateStr) {
                if (!username || username.trim() === "") return null;
                const cleanName = username.trim();
                const rawString = `${cleanName}-${dateStr}-${cleanName}`;
                return CryptoJS.MD5(rawString).toString();
            }
            
            function showToast(message, isError = false) {
                toastEl.textContent = message || (isError ? '❌ 操作失败' : '🌸 操作成功');
                toastEl.style.background = isError ? "#ff99bbdd" : "#ff90b5dd";
                toastEl.style.opacity = '1';
                setTimeout(() => { toastEl.style.opacity = '0'; }, 1800);
            }
            
            let lastTriggeredWhitelistUser = "";
            function refreshAll(updateStorageFlag = true, triggerModal = true) {
                const todayDate = getTodayDateStr();
                todayDateSpan.innerText = todayDate;
                const rawUsername = usernameInput.value;
                const finalUsername = rawUsername ? rawUsername.trim() : "";
                
                if (finalUsername === "") {
                    passwordDisplayDiv.innerHTML = '🐣 喵呜~ 先输入可爱的用户名吧 🐣';
                    passwordDisplayDiv.classList.add('error-pwd');
                    passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
                    passwordDisplayDiv.setAttribute('data-pwd-value', '');
                    return;
                }
                
                const generatedPwd = generateDailyPassword(finalUsername, todayDate);
                if (generatedPwd) {
                    passwordDisplayDiv.innerHTML = generatedPwd;
                    passwordDisplayDiv.classList.remove('error-pwd');
                    passwordDisplayDiv.setAttribute('data-valid-pwd', 'true');
                    passwordDisplayDiv.setAttribute('data-pwd-value', generatedPwd);
                    
                    if (updateStorageFlag) {
                        localStorage.setItem('daily_pwd_username', finalUsername);
                    }
                    
                    if (triggerModal && finalUsername !== lastTriggeredWhitelistUser) {
                        const isWhitelisted = showWhitelistMessageIfNeeded(finalUsername);
                        if (isWhitelisted) lastTriggeredWhitelistUser = finalUsername;
                    }
                } else {
                    passwordDisplayDiv.innerHTML = '❌ 密码生成失败';
                    passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
                    passwordDisplayDiv.setAttribute('data-pwd-value', '');
                }
            }
            
            function forceRegenerate(triggerModal = true) {
                const todayDate = getTodayDateStr();
                todayDateSpan.innerText = todayDate;
                const rawUsername = usernameInput.value;
                const finalUsername = rawUsername ? rawUsername.trim() : "";
                if (finalUsername === "") {
                    passwordDisplayDiv.innerHTML = '🐣 喵~ 先输入可爱的用户名吧 🐣';
                    passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
                    passwordDisplayDiv.setAttribute('data-pwd-value', '');
                    return;
                }
                const newPwd = generateDailyPassword(finalUsername, todayDate);
                if (newPwd) {
                    passwordDisplayDiv.innerHTML = newPwd;
                    passwordDisplayDiv.classList.remove('error-pwd');
                    passwordDisplayDiv.setAttribute('data-valid-pwd', 'true');
                    passwordDisplayDiv.setAttribute('data-pwd-value', newPwd);
                    localStorage.setItem('daily_pwd_username', finalUsername);
                    if (triggerModal && finalUsername !== lastTriggeredWhitelistUser) {
                        const isWhitelisted = showWhitelistMessageIfNeeded(finalUsername);
                        if (isWhitelisted) lastTriggeredWhitelistUser = finalUsername;
                    }
                } else {
                    passwordDisplayDiv.innerHTML = '❌ 生成失败';
                    passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
                    passwordDisplayDiv.setAttribute('data-pwd-value', '');
                }
            }
            
            function copyCurrentPassword() {
                const isValid = passwordDisplayDiv.getAttribute('data-valid-pwd') === 'true';
                const currentPwd = passwordDisplayDiv.getAttribute('data-pwd-value');
                if (!isValid || !currentPwd || currentPwd === "") {
                    showToast('💔 还没有有效密码，先输入昵称吖～', true);
                    return;
                }
                navigator.clipboard.writeText(currentPwd).then(() => {
                    showToast('🐱 密码复制好啦！ 喵呜～～', false);
                }).catch(() => {
                    showToast('❌ 复制失败，但你可以手动戳一戳密码', true);
                });
            }
            
            let debounceTimer;
            function onUsernameInput() {
                if (debounceTimer) clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    const val = usernameInput.value;
                    const trimmed = val ? val.trim() : "";
                    if (trimmed === "") {
                        const todayDate = getTodayDateStr();
                        todayDateSpan.innerText = todayDate;
                        passwordDisplayDiv.innerHTML = '🐣 喵~ 先输入可爱的用户名吧 🐣';
                        passwordDisplayDiv.classList.add('error-pwd');
                        passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
                        passwordDisplayDiv.setAttribute('data-pwd-value', '');
                    } else {
                        refreshAll(true, true);
                    }
                }, 300);
            }
            
            function clearUsernameMemory() {
                localStorage.removeItem('daily_pwd_username');
                usernameInput.value = '';
                const todayDate = getTodayDateStr();
                todayDateSpan.innerText = todayDate;
                passwordDisplayDiv.innerHTML = '🌸 记忆已清除·输入新名字吧 🌸';
                passwordDisplayDiv.classList.add('error-pwd');
                passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
                passwordDisplayDiv.setAttribute('data-pwd-value', '');
                lastTriggeredWhitelistUser = "";
                showToast('🧹 用户名记忆已清除啦', false);
                createFloatingHeart(window.innerWidth/2, window.innerHeight/2);
            }
            
            // 初始化主应用 (验证通过后调用)
            function initMainApp() {
                const savedUsername = localStorage.getItem('daily_pwd_username');
                if (savedUsername && savedUsername.trim() !== "") {
                    usernameInput.value = savedUsername;
                    refreshAll(true, false);  // 加载时不弹白名单
                } else {
                    const todayDate = getTodayDateStr();
                    todayDateSpan.innerText = todayDate;
                    passwordDisplayDiv.innerHTML = '💕 输入你的名字，生成今日密码 💕';
                    passwordDisplayDiv.classList.add('error-pwd');
                    passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
                    passwordDisplayDiv.setAttribute('data-pwd-value', '');
                    usernameInput.value = '';
                }
                
                // 绑定事件
                usernameInput.addEventListener('input', onUsernameInput);
                copyBtn.addEventListener('click', copyCurrentPassword);
                refreshDateBtn.addEventListener('click', () => {
                    forceRegenerate(true);
                    showToast('✨ 已刷新为最新日期密码 ✨', false);
                });
                manualGenBtn.addEventListener('click', () => {
                    forceRegenerate(true);
                    showToast('🐾 已同步最新密码～', false);
                });
                clearMemoryBtn.addEventListener('click', clearUsernameMemory);
                
                addButtonEffect(copyBtn);
                addButtonEffect(refreshDateBtn);
                addButtonEffect(manualGenBtn);
                addButtonEffect(clearMemoryBtn);
            }
            
            // 窗口焦点自动更新日期
            window.addEventListener('focus', () => {
                if (mainCard.classList.contains('active')) {
                    const realToday = getTodayDateStr();
                    const currentDisplay = todayDateSpan.innerText;
                    if (currentDisplay !== realToday) {
                        forceRegenerate(false);
                        showToast('📅 新的一天！密码自动更新啦', false);
                    }
                }
            });
            
            // 启动验证流程
            pawZone.addEventListener('click', onPawClick);
            // 确保验证层一开始可见
            verifyOverlay.style.display = "flex";
            mainCard.classList.remove('active');
        })();
    </script>
</body>

</html>
