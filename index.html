<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>每日密钥 · Daily Key</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: rgba(255,255,255,0.72);
            --text: #1d1d1f;
            --text-secondary: #86868b;
            --accent: #0071e3;
            --accent-hover: #0077ed;
            --border: rgba(0,0,0,0.08);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 20px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 60px rgba(0,0,0,0.08);
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 28px;
            --input-bg: rgba(0,0,0,0.03);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: var(--bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Helvetica Neue', 'PingFang SC', sans-serif;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: var(--text);
        }
        .container { width: 100%; max-width: 420px; }
        /* ---- Frosted Glass Card ---- */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg), var(--shadow-sm);
            padding: 2rem 1.6rem 1.8rem;
            border: 1px solid var(--border);
            opacity: 0;
            transform: translateY(24px);
        }
        /* ---- Header ---- */
        .header { text-align: center; margin-bottom: 24px; }
        .icon {
            font-size: 40px;
            display: inline-block;
            margin-bottom: 6px;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: var(--text);
        }
        .header .sub {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
            font-weight: 400;
        }
        /* ---- Pricing Notice Banner ---- */
        .pricing-banner {
            background: rgba(0,0,0,0.04);
            border-radius: var(--radius-sm);
            padding: 10px 14px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.4;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .pricing-banner .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ff9f0a;
            flex-shrink: 0;
            animation: pulse-dot 2s ease-in-out infinite;
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.75); }
        }
        /* ---- Input ---- */
        .input-group { margin-bottom: 18px; }
        .input-label {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.8rem; font-weight: 600; color: var(--text-secondary);
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
        }
        .username-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--input-bg);
            transition: all 0.2s ease;
            outline: none;
            font-weight: 400;
            color: var(--text);
            font-family: inherit;
            letter-spacing: -0.1px;
        }
        .username-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(0,113,227,0.12);
            background: rgba(255,255,255,0.8);
        }
        .clear-memory { text-align: right; margin-top: 6px; }
        .clear-btn {
            background: none; border: none;
            color: var(--text-secondary); font-size: 0.7rem;
            cursor: pointer; padding: 4px 8px; border-radius: 6px;
            transition: all 0.2s;
        }
        .clear-btn:hover { color: #ff3b30; }
        /* ---- Date Badge ---- */
        .date-badge {
            background: var(--input-bg);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            gap: 10px;
            border: 1px solid var(--border);
        }
        .date-info {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.9rem; color: var(--text); font-weight: 500;
        }
        .date-info strong { font-feature-settings: "tnum"; letter-spacing: 0.5px; }
        .refresh-date-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            padding: 7px 14px; border-radius: 100px;
            color: var(--accent); font-size: 0.78rem; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
            font-family: inherit;
        }
        .refresh-date-btn:hover { background: rgba(0,113,227,0.06); }
        .refresh-date-btn:active { transform: scale(0.96); }
        /* ---- Password Display ---- */
        .password-area {
            background: var(--input-bg);
            border-radius: var(--radius-md);
            padding: 16px 18px;
            margin-bottom: 18px;
            border: 1px solid var(--border);
        }
        .password-label {
            font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1px;
            font-weight: 600; color: var(--text-secondary); margin-bottom: 10px;
        }
        .password-value {
            font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
            font-size: 0.92rem; word-break: break-all;
            background: rgba(255,255,255,0.6); padding: 12px 14px;
            border-radius: var(--radius-sm); color: var(--text);
            font-weight: 400; letter-spacing: 0.2px; line-height: 1.5;
            transition: all 0.25s;
            min-height: 44px; display: flex; align-items: center;
        }
        .password-value.empty { color: var(--text-secondary); }
        /* ---- Buttons ---- */
        .button-group { display: flex; gap: 12px; margin-bottom: 14px; }
        .btn {
            flex: 1; padding: 13px 8px; border-radius: 100px;
            font-weight: 500; font-size: 0.9rem; border: none; cursor: pointer;
            transition: all 0.2s ease; display: flex; align-items: center;
            justify-content: center; gap: 6px; font-family: inherit;
            letter-spacing: -0.2px;
        }
        .btn-primary {
            background: var(--accent); color: #fff;
            box-shadow: 0 2px 8px rgba(0,113,227,0.3);
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-outline {
            background: rgba(0,0,0,0.04); color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-outline:hover { background: rgba(0,0,0,0.06); }
        .btn-outline:active { transform: scale(0.97); }
        /* ---- Footer ---- */
        footer {
            text-align: center; font-size: 0.65rem; color: var(--text-secondary);
            opacity: 0.7;
        }
        /* ---- Toast ---- */
        .toast-msg {
            position: fixed; bottom: 40px; left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(30,30,32,0.92); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: #fff; padding: 12px 22px; border-radius: 100px;
            font-size: 0.85rem; font-weight: 500; opacity: 0;
            pointer-events: none; z-index: 1000;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            white-space: nowrap; letter-spacing: -0.1px;
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        /* ==========新增收费弹窗样式========== */
        .modal-overlay{
            position: fixed;
            inset:0;
            background:rgba(0,0,0,0.45);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);
            z-index:9999;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
            opacity:0;
            pointer-events:none;
        }
        .modal-overlay.active{
            opacity:1;
            pointer-events:auto;
        }
        .modal-box{
            width:100%;
            max-width:380px;
            background:#ffffff;
            border-radius:var(--radius-lg);
            box-shadow:0 15px 50px rgba(0,0,0,0.18);
            padding:24px 22px;
            transform:scale(0.92) translateY(12px);
            transition:0.28s ease;
        }
        .modal-overlay.active .modal-box{
            transform:scale(1) translateY(0);
        }
        .modal-title{
            font-size:1.2rem;
            font-weight:600;
            text-align:center;
            margin-bottom:16px;
        }
        .modal-content{
            font-size:0.9rem;
            line-height:1.65;
            color:#333;
            margin-bottom:18px;
        }
        .price-item{
            padding:6px 0;
        }
        .modal-small-tip{
            font-size:0.76rem;
            color:#777;
            margin-top:10px;
            line-height:1.55;
        }
        .modal-close-btn{
            width:100%;
            padding:12px;
            border-radius:100px;
            border:none;
            background:var(--accent);
            color:#fff;
            font-size:0.95rem;
            font-weight:500;
            cursor:pointer;
            margin-top:8px;
        }
        .modal-close-btn:active{
            transform:scale(0.97);
        }
        @media (max-width: 480px) {
            .card { padding: 1.5rem 1.2rem; border-radius: 24px; }
            .button-group { gap: 10px; }
            .password-value { font-size: 0.8rem; }
            .header h1 { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card" id="card">
        <div class="header">
            <div class="icon">🔐</div>
            <h1>每日密钥</h1>
            <div class="sub">Daily Password Generator</div>
        </div>
        <!-- Pricing Notice -->
        <div class="pricing-banner" id="pricingBanner">
            <span class="dot"></span>
            <span>下学期起本软件将开始收费，具体细节待管理员通知。</span>
        </div>
        <!-- Username Input -->
        <div class="input-group">
            <div class="input-label">昵称 / Username</div>
            <input type="text" id="usernameInput" class="username-input" placeholder="输入你的用户名" autocomplete="off">
            <div class="clear-memory">
                <button id="clearMemoryBtn" class="clear-btn" type="button">清除记忆</button>
            </div>
        </div>
        <!-- Date -->
        <div class="date-badge">
            <div class="date-info">
                <span>📅</span>
                <strong id="todayDateDisplay">----</strong>
            </div>
            <button id="refreshDateBtn" class="refresh-date-btn">刷新</button>
        </div>
        <!-- Password -->
        <div class="password-area">
            <div class="password-label">今日密码 · MD5</div>
            <div id="passwordDisplay" class="password-value empty">输入用户名后自动生成</div>
        </div>
        <!-- Actions -->
        <div class="button-group">
            <button id="copyBtn" class="btn btn-primary">复制密码</button>
            <button id="manualGenBtn" class="btn btn-outline">生成 / 同步</button>
        </div>
        <footer>每日密钥 · Daily Key</footer>
    </div>
</div>
<!-- =========新增收费弹窗DOM========= -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <div class="modal-title">预计收费通知</div>
        <div class="modal-content">
            <p>该程序可能将于新生开学后进行收费，具体的时间根据时间安排就行。后续可能考虑重新制作安卓版，并尝试对脚本版本进行优化</p>
            <div class="price-item">• 三块钱一天(适合临时干)</div>
            <div class="price-item">• 20块钱7天(周卡，建议短期干)</div>
            <div class="price-item">• 80块钱30天(适合长期干)</div>
            <div class="modal-small-tip">
                7天和30天在下午5点之后进行交费的会多送一天，也就是赠送当天
            </div>
        </div>
        <button class="modal-close-btn" id="modalCloseBtn">我知道了</button>
    </div>
</div>

<div id="toastMsg" class="toast-msg"></div>
<script>
(function() {
    const usernameInput = document.getElementById('usernameInput');
    const todayDateSpan = document.getElementById('todayDateDisplay');
    const passwordDisplayDiv = document.getElementById('passwordDisplay');
    const copyBtn = document.getElementById('copyBtn');
    const refreshDateBtn = document.getElementById('refreshDateBtn');
    const manualGenBtn = document.getElementById('manualGenBtn');
    const clearMemoryBtn = document.getElementById('clearMemoryBtn');
    const toastEl = document.getElementById('toastMsg');
    const card = document.getElementById('card');
    const pricingBanner = document.getElementById('pricingBanner');

    //弹窗元素
    const modalOverlay = document.getElementById('modalOverlay');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    //关闭弹窗
    modalCloseBtn.addEventListener('click',function(){
        modalOverlay.classList.remove('active');
    });
    //点击遮罩层关闭弹窗
    modalOverlay.addEventListener('click',function(e){
        if(e.target === modalOverlay){
            modalOverlay.classList.remove('active');
        }
    });

    // ---- GSAP Entrance Animation ----
    gsap.to(card, {
        opacity: 1,
        y: 0,
        duration: 0.7,
        ease: "power3.out",
        delay: 0.1
    });
    gsap.from(pricingBanner, {
        opacity: 0,
        y: -8,
        duration: 0.5,
        ease: "power2.out",
        delay: 0.35
    });

    function getTodayDateStr() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}${m}${d}`;
    }
    function showToast(msg, isError) {
        toastEl.textContent = msg || (isError ? '复制失败' : '已复制到剪贴板');
        gsap.killTweensOf(toastEl);
        gsap.set(toastEl, { opacity: 0, y: 10 });
        gsap.to(toastEl, {
            opacity: 1, y: 0,
            duration: 0.3, ease: "power2.out",
            onComplete: function() {
                gsap.to(toastEl, {
                    opacity: 0, y: -6,
                    duration: 0.35, ease: "power2.in",
                    delay: 1.5
                });
            }
        });
    }
    function generateDailyPassword(username, dateStr) {
        if (!username || username.trim() === "") return null;
        const cleanName = username.trim();
        const rawString = `${cleanName}-${dateStr}-${cleanName}`;
        return CryptoJS.MD5(rawString).toString();
    }
    function refreshAll(updateStorageFlag) {
        const todayDate = getTodayDateStr();
        gsap.to(todayDateSpan, { opacity: 0, duration: 0.1, onComplete: function() {
            todayDateSpan.innerText = todayDate;
            gsap.to(todayDateSpan, { opacity: 1, duration: 0.2 });
        }});
        let rawUsername = usernameInput.value;
        let finalUsername = rawUsername ? rawUsername.trim() : "";
        if (finalUsername === "") {
            passwordDisplayDiv.innerHTML = '输入用户名后自动生成';
            passwordDisplayDiv.classList.add('empty');
            passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
            passwordDisplayDiv.setAttribute('data-pwd-value', '');
            return;
        }
        const generatedPwd = generateDailyPassword(finalUsername, todayDate);
        if (generatedPwd) {
            passwordDisplayDiv.innerHTML = generatedPwd;
            passwordDisplayDiv.classList.remove('empty');
            passwordDisplayDiv.setAttribute('data-valid-pwd', 'true');
            passwordDisplayDiv.setAttribute('data-pwd-value', generatedPwd);
            gsap.from(passwordDisplayDiv, { scale: 0.98, duration: 0.2, ease: "power2.out" });
        }
        if (updateStorageFlag && finalUsername !== "") {
            localStorage.setItem('daily_pwd_username', finalUsername);
        }
    }
    function forceRegenerateAndSave() {
        const todayDate = getTodayDateStr();
        todayDateSpan.innerText = todayDate;
        let rawUsername = usernameInput.value;
        let finalUsername = rawUsername ? rawUsername.trim() : "";
        if (finalUsername === "") {
            passwordDisplayDiv.innerHTML = '输入用户名后自动生成';
            passwordDisplayDiv.classList.add('empty');
            passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
            passwordDisplayDiv.setAttribute('data-pwd-value', '');
            return;
        }
        const newPwd = generateDailyPassword(finalUsername, todayDate);
        if (newPwd) {
            passwordDisplayDiv.innerHTML = newPwd;
            passwordDisplayDiv.classList.remove('empty');
            passwordDisplayDiv.setAttribute('data-valid-pwd', 'true');
            passwordDisplayDiv.setAttribute('data-pwd-value', newPwd);
            localStorage.setItem('daily_pwd_username', finalUsername);
            gsap.from(passwordDisplayDiv, { scale: 0.98, duration: 0.25, ease: "power2.out" });
        }
    }
    function copyCurrentPassword() {
        const isValid = passwordDisplayDiv.getAttribute('data-valid-pwd') === 'true';
        const currentPwd = passwordDisplayDiv.getAttribute('data-pwd-value');
        if (!isValid || !currentPwd) {
            showToast('请先输入昵称生成密码', true);
            return;
        }
        navigator.clipboard.writeText(currentPwd).then(function() {
            showToast('密码已复制');
            gsap.to(copyBtn, { scale: 0.96, duration: 0.1, yoyo: true, repeat: 1 });
        }).catch(function() {
            showToast('复制失败，请手动选择', true);
        });
    }
    var debounceTimer;
    function onUsernameInput() {
        if (debounceTimer) clearTimeout(debounceTimer);
        debounceTimer = setTimeout(function() {
            var val = usernameInput.value;
            var trimmed = val ? val.trim() : "";
            if (trimmed === "") {
                var todayDate = getTodayDateStr();
                todayDateSpan.innerText = todayDate;
                passwordDisplayDiv.innerHTML = '输入用户名后自动生成';
                passwordDisplayDiv.classList.add('empty');
                passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
                passwordDisplayDiv.setAttribute('data-pwd-value', '');
            } else {
                refreshAll(true);
            }
        }, 50);
    }
    function clearUsernameMemory() {
        localStorage.removeItem('daily_pwd_username');
        usernameInput.value = '';
        var todayDate = getTodayDateStr();
        todayDateSpan.innerText = todayDate;
        passwordDisplayDiv.innerHTML = '记忆已清除 · 输入新名字';
        passwordDisplayDiv.classList.add('empty');
        passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
        passwordDisplayDiv.setAttribute('data-pwd-value', '');
        showToast('用户名记忆已清除');
        gsap.from(passwordDisplayDiv, { x: -4, duration: 0.25, ease: "power2.out", clearProps: "x" });
    }
    function init() {
        var savedUsername = localStorage.getItem('daily_pwd_username');
        if (savedUsername && savedUsername.trim() !== "") {
            usernameInput.value = savedUsername;
            refreshAll(true);
        } else {
            var todayDate = getTodayDateStr();
            todayDateSpan.innerText = todayDate;
            passwordDisplayDiv.innerHTML = '输入用户名后自动生成';
            passwordDisplayDiv.classList.add('empty');
            passwordDisplayDiv.setAttribute('data-valid-pwd', 'false');
            passwordDisplayDiv.setAttribute('data-pwd-value', '');
            usernameInput.value = '';
        }
        //页面加载完成延迟弹出收费弹窗
        setTimeout(()=>{
            modalOverlay.classList.add('active');
        },600);

        usernameInput.addEventListener('input', onUsernameInput);
        copyBtn.addEventListener('click', copyCurrentPassword);
        refreshDateBtn.addEventListener('click', function() {
            forceRegenerateAndSave();
            showToast('已刷新为最新日期密码');
        });
        manualGenBtn.addEventListener('click', function() {
            forceRegenerateAndSave();
            showToast('已同步最新密码');
        });
        clearMemoryBtn.addEventListener('click', clearUsernameMemory);
    }
    window.addEventListener('focus', function() {
        var currentDisplayDate = todayDateSpan.innerText;
        var realToday = getTodayDateStr();
        if (currentDisplayDate !== realToday) {
            forceRegenerateAndSave();
            showToast('新的一天！密码已自动更新');
        } else {
            var isValidFlag = passwordDisplayDiv.getAttribute('data-valid-pwd') === 'true';
            var usernameNow = usernameInput.value.trim();
            if (usernameNow !== "" && !isValidFlag) {
                forceRegenerateAndSave();
            }
        }
    });
    window.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
